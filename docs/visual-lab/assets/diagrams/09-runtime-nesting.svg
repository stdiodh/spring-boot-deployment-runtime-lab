  <text x="80" y="209" text-anchor="middle" fill="#4b587c" font-family="system-ui, sans-serif" font-size="24">CODE</text>

  <path d="M140 168H155" stroke="#2955e4" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="160" y="105" width="120" height="126" rx="14" fill="#ffffff" stroke="#2955e4" stroke-width="3"/>
