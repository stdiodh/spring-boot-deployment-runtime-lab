  <text x="360" y="143" text-anchor="middle" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="900">3</text>
  <text x="360" y="177" text-anchor="middle" fill="#111b3f" font-family="system-ui, sans-serif" font-size="24" font-weight="800">DOCKER</text>
  <text x="360" y="209" text-anchor="middle" fill="#4b587c" font-family="system-ui, sans-serif" font-size="24">IMAGE</text>

