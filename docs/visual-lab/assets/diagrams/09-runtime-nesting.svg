<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title desc">
  <title id="title">Source에서 Spring Boot process까지의 빌드와 실행 순서</title>
  <desc id="desc">Source code에서 jar와 Docker image를 만들고, image에서 container를 생성한 뒤 Spring Boot process를 실행합니다. 환경 설정은 container 실행 시점에 주입됩니다.</desc>
  <metadata>Source: A&amp;I Sequence 09 theory, implementation, checklist. License: repository policy; no standalone license grant.</metadata>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0 0 12 6 0 12Z" fill="#2955e4"/>
    </marker>
  </defs>
  <rect width="720" height="500" rx="22" fill="#f1f7ff"/>
  <text x="24" y="45" fill="#111b3f" font-family="system-ui, sans-serif" font-size="30" font-weight="850">BUILD → RUNTIME</text>
  <text x="24" y="83" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="800">BUILD · 산출물 생성</text>
  <text x="414" y="83" fill="#0c2691" font-family="system-ui, sans-serif" font-size="24" font-weight="800">RUNTIME · 실행</text>

