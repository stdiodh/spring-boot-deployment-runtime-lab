name: Deploy to EC2

on:
  push:
    tags:
      - "deploy-https-v*.*.*"

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aandi-deployment-runtime-lab
  RELEASE_TAG: ${{ github.ref_name }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
  RELEASE_DIR: /home/${{ secrets.EC2_USERNAME }}/aandi-deployment-runtime-lab
  COMPOSE_VERSION: v5.1.4

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment tag
        id: release
        env:
          EVENT_CREATED: ${{ github.event.created }}
          EVENT_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_CREATED" != "true" || "$EVENT_FORCED" != "false" ]]; then
            echo "::error::Deployment tags must be newly created and must not be force-moved."
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^deploy-https-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo \
              "::error::Deployment tag must match deploy-https-v<major>.<minor>.<patch>."
            exit 1
          fi

          tag_ref="refs/tags/${GITHUB_REF_NAME}"
          tag_refs="$(git ls-remote --tags origin "$tag_ref" "${tag_ref}^{}")"
          tag_object_sha="$(
            awk -v expected="$tag_ref" '$2 == expected { print $1 }' <<< "$tag_refs"
          )"
          release_sha="$(
            awk -v expected="${tag_ref}^{}" '$2 == expected { print $1 }' <<< "$tag_refs"
          )"

          if [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40}$ ]] || \
            [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          then
            echo "::error::Deployment tags must be annotated tags."
            exit 1
          fi
          if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Remote deployment tag does not match the workflow revision."
            exit 1
          fi

          git fetch --no-tags origin \
            "+refs/heads/10-answer:refs/remotes/origin/10-answer"
          if ! git merge-base --is-ancestor \
            "$release_sha" refs/remotes/origin/10-answer
          then
            echo "::error::Deployment tags must reference a commit contained in 10-answer."
            exit 1
          fi
          printf 'sha=%s\n' "$release_sha" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Validate deployment scripts
        run: bash -n scripts/ensure-compose.sh scripts/deploy.sh scripts/check-deploy.sh

      - name: Validate Nginx templates
        run: |
          set -euo pipefail

          test_domain="validation.example.com"
          certificate_dir="${RUNNER_TEMP}/nginx-certificate"
          install -m 700 -d "$certificate_dir"
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -nodes \
            -days 1 \
            -subj "/CN=${test_domain}" \
            -keyout "${certificate_dir}/privkey.pem" \
            -out "${certificate_dir}/fullchain.pem" \
            >/dev/null 2>&1

          for template in http.conf.template https.conf.template; do
            docker run --rm \
              --add-host app:127.0.0.1 \
              --env "APP_DOMAIN=${test_domain}" \
              --mount \
              "type=bind,src=${GITHUB_WORKSPACE}/deploy/nginx/${template},dst=/etc/nginx/templates/default.conf.template,readonly" \
              --mount \
              "type=bind,src=${certificate_dir},dst=/etc/letsencrypt/live/${test_domain},readonly" \
              nginx:1.28.3-alpine \
              nginx -t
          done

      - name: Run tests and build executable jar
        run: ./gradlew clean test bootJar

      - name: Check deployment artifact
        run: test -f build/libs/app.jar

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build and publish image
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          sha_image="${IMAGE_REPOSITORY}:${RELEASE_SHA}"
          release_image="${IMAGE_REPOSITORY}:${RELEASE_TAG}"

          if docker pull "$sha_image"; then
            existing_revision="$(
              docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "$sha_image"
            )"
            if [[ "$existing_revision" != "$RELEASE_SHA" ]]; then
              echo "::error::Existing SHA image has a different revision label."
              exit 1
            fi
            docker tag "$sha_image" "$release_image"
          else
            docker build \
              --build-arg APP_VERSION="$RELEASE_SHA" \
              --build-arg APP_RELEASE="$RELEASE_TAG" \
              --tag "$sha_image" \
              --tag "$release_image" \
              .
            docker push "$sha_image"
          fi
          docker push "$release_image"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    outputs:
      app_domain: ${{ steps.runtime.outputs.app_domain }}
    env:
      APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aandi-deployment-runtime-lab:${{ needs.publish.outputs.release_sha }}
      APP_DOMAIN: ${{ vars.PROD_DOMAIN }}
      CERTBOT_EMAIL: ${{ vars.PROD_CERTBOT_EMAIL }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Build and validate runtime environment
        id: runtime
        env:
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_MYSQL_ROOT_PASSWORD: ${{ secrets.PROD_MYSQL_ROOT_PASSWORD }}
          PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          PROD_MAIL_USERNAME: ${{ secrets.PROD_MAIL_USERNAME }}
          PROD_MAIL_PASSWORD: ${{ secrets.PROD_MAIL_PASSWORD }}
          PROD_GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
          PROD_DB_USERNAME: ${{ vars.PROD_DB_USERNAME }}
          PROD_MYSQL_DATABASE: ${{ vars.PROD_MYSQL_DATABASE }}
          PROD_GOOGLE_CLIENT_ID: ${{ vars.PROD_GOOGLE_CLIENT_ID }}
          PROD_DOMAIN: ${{ vars.PROD_DOMAIN }}
          PROD_CERTBOT_EMAIL: ${{ vars.PROD_CERTBOT_EMAIL }}
          PROD_FRONTEND_URL: ${{ vars.PROD_FRONTEND_URL }}
          PROD_PASSWORD_RESET_URL: ${{ vars.PROD_PASSWORD_RESET_URL }}
          PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS: ${{ vars.PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS }}
        run: |
          set -euo pipefail

          runtime_env="${RUNNER_TEMP}/runtime.env"

          validate_value() {
            local name="$1"
            local value="${!name-}"

            if [[ -z "$value" ]]; then
              echo "::error::Required production setting is missing: ${name}"
              exit 1
            fi

            if [[ "$value" == *$'\r'* || "$value" == *$'\n'* || "$value" == *"'"* ]]; then
              echo "::error::Production setting contains an unsupported character: ${name}"
              exit 1
            fi
          }

          write_value() {
            local key="$1"
            local source_name="$2"
            printf "%s='%s'\n" "$key" "${!source_name}"
          }

          validate_value PROD_DOMAIN
          validate_value PROD_CERTBOT_EMAIL

          domain_pattern='^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
          if (( ${#PROD_DOMAIN} > 253 )) || [[ ! "$PROD_DOMAIN" =~ $domain_pattern ]]; then
            echo "::error::PROD_DOMAIN must be a lowercase fully qualified domain name."
            exit 1
          fi
          if [[ ! "$PROD_CERTBOT_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::PROD_CERTBOT_EMAIL must be a valid email address."
            exit 1
          fi

          if [[ -z "${PROD_FRONTEND_URL:-}" ]]; then
            PROD_FRONTEND_URL="https://${PROD_DOMAIN}/realtime-demo.html"
          fi
          if [[ -z "${PROD_PASSWORD_RESET_URL:-}" ]]; then
            PROD_PASSWORD_RESET_URL="https://${PROD_DOMAIN}/auth-demo.html"
          fi
          if [[ -z "${PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:-}" ]]; then
            PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS="https://${PROD_DOMAIN}"
          fi

          for name in \
            PROD_DB_PASSWORD \
            PROD_MYSQL_ROOT_PASSWORD \
            PROD_JWT_SECRET \
            PROD_MAIL_USERNAME \
            PROD_MAIL_PASSWORD \
            PROD_GOOGLE_CLIENT_SECRET \
            PROD_DB_USERNAME \
            PROD_MYSQL_DATABASE \
            PROD_GOOGLE_CLIENT_ID \
            PROD_DOMAIN \
            PROD_CERTBOT_EMAIL \
            PROD_FRONTEND_URL \
            PROD_PASSWORD_RESET_URL \
            PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
          do
            validate_value "$name"
          done

          if [[ "$PROD_DB_USERNAME" == "root" ]]; then
            echo "::error::PROD_DB_USERNAME must be a dedicated application user."
            exit 1
          fi
          if [[ ! "$PROD_DB_USERNAME" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::PROD_DB_USERNAME contains an unsupported character."
            exit 1
          fi
          if [[ ! "$PROD_MYSQL_DATABASE" =~ ^[A-Za-z0-9_]+$ ]]; then
            echo "::error::PROD_MYSQL_DATABASE contains an unsupported character."
            exit 1
          fi
          if [[ "$PROD_DB_PASSWORD" == "$PROD_MYSQL_ROOT_PASSWORD" ]]; then
            echo "::error::Application and MySQL root passwords must differ."
            exit 1
          fi
          jwt_secret_bytes="$(printf '%s' "$PROD_JWT_SECRET" | wc -c | tr -d ' ')"
          if (( jwt_secret_bytes < 32 )); then
            echo "::error::PROD_JWT_SECRET must contain at least 32 bytes."
            exit 1
          fi
          for url_name in \
            PROD_FRONTEND_URL \
            PROD_PASSWORD_RESET_URL \
            PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
          do
            if [[ "${!url_name}" != https://* ]]; then
              echo "::error::${url_name} must use https://."
              exit 1
            fi
          done

          validate_value APP_IMAGE

          umask 077
          : > "$runtime_env"
          chmod 600 "$runtime_env"

          {
            printf "APP_IMAGE='%s'\n" "$APP_IMAGE"
            printf "SPRING_PROFILES_ACTIVE='prod'\n"
            write_value APP_DOMAIN PROD_DOMAIN
            write_value CERTBOT_EMAIL PROD_CERTBOT_EMAIL
            printf "DB_URL='jdbc:mysql://mysql:3306/%s?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8'\n" \
              "$PROD_MYSQL_DATABASE"
            write_value DB_USERNAME PROD_DB_USERNAME
            write_value DB_PASSWORD PROD_DB_PASSWORD
            printf "REDIS_HOST='redis'\n"
            printf "REDIS_PORT='6379'\n"
            write_value JWT_SECRET PROD_JWT_SECRET
            printf "JWT_EXPIRATION_MS='3600000'\n"
            printf "MAIL_HOST='smtp.gmail.com'\n"
            printf "MAIL_PORT='587'\n"
            write_value MAIL_USERNAME PROD_MAIL_USERNAME
            write_value MAIL_PASSWORD PROD_MAIL_PASSWORD
            write_value GOOGLE_CLIENT_ID PROD_GOOGLE_CLIENT_ID
            write_value GOOGLE_CLIENT_SECRET PROD_GOOGLE_CLIENT_SECRET
            write_value APP_FRONTEND_URL PROD_FRONTEND_URL
            write_value APP_PASSWORD_RESET_URL PROD_PASSWORD_RESET_URL
            write_value APP_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS PROD_WEBSOCKET_ALLOWED_ORIGIN_PATTERNS
            write_value MYSQL_DATABASE PROD_MYSQL_DATABASE
            write_value MYSQL_USER PROD_DB_USERNAME
            write_value MYSQL_PASSWORD PROD_DB_PASSWORD
            write_value MYSQL_ROOT_PASSWORD PROD_MYSQL_ROOT_PASSWORD
          } > "$runtime_env"

          test -s "$runtime_env"
          test "$(stat -c '%a' "$runtime_env")" = "600"
          env -u APP_IMAGE docker compose \
            --env-file "$runtime_env" \
            -f deploy/compose.prod.yaml \
            config --quiet
          printf 'app_domain=%s\n' "$PROD_DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Validate production DNS
        run: |
          set -euo pipefail

          python3 - "$APP_DOMAIN" "$EC2_HOST" <<'PY'
          import socket
          import sys

          domain, target = sys.argv[1:]

          def addresses(host, family):
              try:
                  results = socket.getaddrinfo(host, None, family, socket.SOCK_STREAM)
              except socket.gaierror:
                  return set()
              return {result[4][0] for result in results}

          domain_ipv4 = addresses(domain, socket.AF_INET)
          target_ipv4 = addresses(target, socket.AF_INET)
          domain_ipv6 = addresses(domain, socket.AF_INET6)

          if not domain_ipv4 or not target_ipv4:
              print("::error::PROD_DOMAIN or EC2_HOST did not resolve to IPv4.")
              raise SystemExit(1)
          if domain_ipv4 != target_ipv4:
              print("::error::Every PROD_DOMAIN A record must match the EC2 deployment target.")
              raise SystemExit(1)
          if domain_ipv6:
              print("::error::PROD_DOMAIN must not publish AAAA records for this IPv4-only deployment.")
              raise SystemExit(1)
          PY

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aandi-ec2.pem
          chmod 600 ~/.ssh/aandi-ec2.pem
          known_hosts_tmp="${RUNNER_TEMP}/known_hosts"
          for attempt in {1..6}; do
            if ssh-keyscan -T 10 -H "$EC2_HOST" > "$known_hosts_tmp" 2>/dev/null && \
              [[ -s "$known_hosts_tmp" ]]
            then
              install -m 600 "$known_hosts_tmp" ~/.ssh/known_hosts
              break
            fi

            if (( attempt == 6 )); then
              echo "::error::EC2 SSH port did not respond after 6 attempts."
              exit 1
            fi
            echo "EC2 SSH port is not ready; retrying (${attempt}/6)."
            sleep 5
          done

      - name: Upload staged deployment bundle
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "install -m 700 -d \
              '${RELEASE_DIR}/.deploy-next/deploy/nginx' \
              '${RELEASE_DIR}/.deploy-next/scripts'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            deploy/compose.prod.yaml \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/.deploy-next/deploy/compose.prod.yaml"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            deploy/nginx/http.conf.template deploy/nginx/https.conf.template \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/.deploy-next/deploy/nginx/"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            scripts/ensure-compose.sh scripts/deploy.sh scripts/check-deploy.sh \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/.deploy-next/scripts/"

      - name: Prepare Docker access and Compose plugin
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash -s -- '${RELEASE_DIR}' '${COMPOSE_VERSION}'" <<'REMOTE'
          set -euo pipefail

          release_dir="$1"
          compose_version="$2"
          deployment_user="$(id -un)"

          cd "$release_dir"
          bash .deploy-next/scripts/ensure-compose.sh "$compose_version"

          if docker info >/dev/null 2>&1; then
            exit 0
          fi

          if ! sudo -n docker info >/dev/null 2>&1; then
            echo \
              "Docker daemon is unavailable or the deployment user has no passwordless sudo." \
              >&2
            exit 1
          fi

          sudo -n usermod -aG docker "$deployment_user"
          id -nG "$deployment_user" |
            tr ' ' '\n' |
            grep -Fxq docker
          echo "Docker group access configured for the next SSH session."
          REMOTE

      - name: Upload runtime environment
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "install -m 600 /dev/null '${RELEASE_DIR}/.env.next'"
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${RUNNER_TEMP}/runtime.env" \
            "${EC2_USERNAME}@${EC2_HOST}:${RELEASE_DIR}/.env.next"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "test \"\$(stat -c '%a' '${RELEASE_DIR}/.env.next')\" = '600'"

      - name: Install runtime environment and deploy exact image
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash -s -- '${RELEASE_DIR}' '${APP_IMAGE}' '${APP_DOMAIN}' '${CERTBOT_EMAIL}'" <<'REMOTE'
          set -euo pipefail

          release_dir="$1"
          app_image="$2"
          app_domain="$3"
          certbot_email="$4"
          next_bundle="${release_dir}/.deploy-next"
          previous_bundle="${release_dir}/.deploy.previous"
          previous_bundle_next="${release_dir}/.deploy.previous.next"
          previous_bundle_old="${release_dir}/.deploy.previous.old"
          install_in_progress=0
          current_env_was_present=0

          restore_previous_bundle() {
            local previous_file=""
            local target_file=""

            if [[ ! -f "${previous_bundle}/.ready" && \
              -f "${previous_bundle_old}/.ready" ]]
            then
              rm -rf "$previous_bundle"
              mv "$previous_bundle_old" "$previous_bundle"
            fi
            [[ -f "${previous_bundle}/.ready" ]] || return 1
            [[ -f "${previous_bundle}/deploy/compose.prod.yaml" ]] || return 1

            install -m 755 -d deploy/nginx scripts
            install -m 644 \
              "${previous_bundle}/deploy/compose.prod.yaml" \
              deploy/compose.prod.yaml

            for relative_file in \
              deploy/nginx/http.conf.template \
              deploy/nginx/https.conf.template
            do
              previous_file="${previous_bundle}/${relative_file}"
              target_file="${release_dir}/${relative_file}"
              if [[ -f "$previous_file" ]]; then
                install -m 644 "$previous_file" "$target_file"
              else
                rm -f "$target_file"
              fi
            done

            for relative_file in \
              scripts/ensure-compose.sh \
              scripts/deploy.sh \
              scripts/check-deploy.sh
            do
              previous_file="${previous_bundle}/${relative_file}"
              target_file="${release_dir}/${relative_file}"
              if [[ -f "$previous_file" ]]; then
                install -m 755 "$previous_file" "$target_file"
              else
                rm -f "$target_file"
              fi
            done
          }

          restore_interrupted_install() {
            local original_status="$1"

            if (( original_status == 0 )); then
              return 0
            fi

            trap - EXIT
            set +e
            if (( install_in_progress == 1 )); then
              if (( current_env_was_present == 1 )); then
                install -m 600 .env.previous .env
              else
                rm -f .env
              fi

              if ! restore_previous_bundle; then
                rm -f \
                  deploy/compose.prod.yaml \
                  deploy/nginx/http.conf.template \
                  deploy/nginx/https.conf.template \
                  scripts/ensure-compose.sh \
                  scripts/deploy.sh \
                  scripts/check-deploy.sh
              fi
              echo \
                "Interrupted live bundle installation was restored before exit." \
                >&2
            fi
            exit "$original_status"
          }

          trap 'restore_interrupted_install "$?"' EXIT

          cd "$release_dir"
          docker info >/dev/null
          test -f .env.next
          test -f "${next_bundle}/deploy/compose.prod.yaml"
          test -f "${next_bundle}/deploy/nginx/http.conf.template"
          test -f "${next_bundle}/deploy/nginx/https.conf.template"
          test -f "${next_bundle}/scripts/ensure-compose.sh"
          test -f "${next_bundle}/scripts/deploy.sh"
          test -f "${next_bundle}/scripts/check-deploy.sh"
          chmod 600 .env.next
          grep -Fxq "APP_IMAGE='${app_image}'" .env.next
          grep -Fxq "APP_DOMAIN='${app_domain}'" .env.next
          grep -Fxq "CERTBOT_EMAIL='${certbot_email}'" .env.next
          bash -n \
            "${next_bundle}/scripts/ensure-compose.sh" \
            "${next_bundle}/scripts/deploy.sh" \
            "${next_bundle}/scripts/check-deploy.sh"
          env -u APP_IMAGE docker compose \
            --env-file .env.next \
            -f "${next_bundle}/deploy/compose.prod.yaml" \
            config --quiet

          if [[ -f .env ]]; then
            cp -p .env .env.previous
            chmod 600 .env.previous
            current_env_was_present=1
          fi

          if [[ ! -f "${previous_bundle}/.ready" && \
            -f "${previous_bundle_old}/.ready" ]]
          then
            rm -rf "$previous_bundle"
            mv "$previous_bundle_old" "$previous_bundle"
          fi

          rm -rf "$previous_bundle_next"
          install -m 700 -d \
            "${previous_bundle_next}/deploy/nginx" \
            "${previous_bundle_next}/scripts" \
            deploy/nginx \
            scripts

          snapshot_file() {
            local source_file="$1"
            local target_file="$2"
            local mode="$3"

            if [[ -f "$source_file" ]]; then
              install -m "$mode" "$source_file" "$target_file"
            else
              rm -f "$target_file"
            fi
          }

          if [[ -f deploy/compose.prod.yaml && \
            -f scripts/deploy.sh && \
            -f scripts/check-deploy.sh ]]
          then
            snapshot_file deploy/compose.prod.yaml \
              "${previous_bundle_next}/deploy/compose.prod.yaml" 644
            snapshot_file deploy/nginx/http.conf.template \
              "${previous_bundle_next}/deploy/nginx/http.conf.template" 644
            snapshot_file deploy/nginx/https.conf.template \
              "${previous_bundle_next}/deploy/nginx/https.conf.template" 644
            snapshot_file scripts/ensure-compose.sh \
              "${previous_bundle_next}/scripts/ensure-compose.sh" 755
            snapshot_file scripts/deploy.sh \
              "${previous_bundle_next}/scripts/deploy.sh" 755
            snapshot_file scripts/check-deploy.sh \
              "${previous_bundle_next}/scripts/check-deploy.sh" 755
            printf 'ready\n' > "${previous_bundle_next}/.ready"

            rm -rf "$previous_bundle_old"
            if [[ -e "$previous_bundle" ]]; then
              mv "$previous_bundle" "$previous_bundle_old"
            fi
            mv "$previous_bundle_next" "$previous_bundle"
          else
            rm -rf "$previous_bundle_next"
          fi

          install_in_progress=1
          install -m 644 "${next_bundle}/deploy/compose.prod.yaml" \
            deploy/compose.prod.yaml
          install -m 644 "${next_bundle}/deploy/nginx/http.conf.template" \
            deploy/nginx/http.conf.template
          install -m 644 "${next_bundle}/deploy/nginx/https.conf.template" \
            deploy/nginx/https.conf.template
          install -m 755 "${next_bundle}/scripts/ensure-compose.sh" \
            scripts/ensure-compose.sh
          install -m 755 "${next_bundle}/scripts/deploy.sh" scripts/deploy.sh
          install -m 755 "${next_bundle}/scripts/check-deploy.sh" \
            scripts/check-deploy.sh
          mv .env.next .env
          chmod 600 .env
          bash scripts/deploy.sh \
            "$release_dir" "$app_image" "$app_domain" "$certbot_email"
          install_in_progress=0
          rm -rf "$previous_bundle_old" "$previous_bundle_next" || true
          REMOTE

  verify:
    needs:
      - publish
      - deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aandi-deployment-runtime-lab:${{ needs.publish.outputs.release_sha }}
      RELEASE_SHA: ${{ needs.publish.outputs.release_sha }}
      APP_DOMAIN: ${{ needs.deploy.outputs.app_domain }}
    steps:
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aandi-ec2.pem
          chmod 600 ~/.ssh/aandi-ec2.pem
          known_hosts_tmp="${RUNNER_TEMP}/known_hosts"
          for attempt in {1..6}; do
            if ssh-keyscan -T 10 -H "$EC2_HOST" > "$known_hosts_tmp" 2>/dev/null && \
              [[ -s "$known_hosts_tmp" ]]
            then
              install -m 600 "$known_hosts_tmp" ~/.ssh/known_hosts
              break
            fi

            if (( attempt == 6 )); then
              echo "::error::EC2 SSH port did not respond after 6 attempts."
              exit 1
            fi
            echo "EC2 SSH port is not ready; retrying (${attempt}/6)."
            sleep 5
          done

      - name: Verify exact image and readiness
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/aandi-ec2.pem \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash -s -- '${RELEASE_DIR}' '${APP_IMAGE}' '${RELEASE_SHA}' '${APP_DOMAIN}'" <<'REMOTE'
          set -euo pipefail

          release_dir="$1"
          expected_image="$2"
          expected_revision="$3"
          app_domain="$4"

          cd "$release_dir"
          bash scripts/check-deploy.sh \
            "$release_dir" "$expected_image" "$expected_revision" "$app_domain"
          REMOTE

          if ! curl --fail --silent --show-error \
            --connect-timeout 2 \
            --max-time 5 \
            --retry 23 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 120 \
            "https://${APP_DOMAIN}/actuator/health/readiness" >/dev/null
          then
            echo \
              "::error::External HTTPS readiness failed; requesting rollback."
            ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -i ~/.ssh/aandi-ec2.pem \
              "${EC2_USERNAME}@${EC2_HOST}" \
              "bash -s -- '${RELEASE_DIR}' '${APP_IMAGE}' '${RELEASE_SHA}' '${APP_DOMAIN}'" \
              <<'REMOTE'
          set -euo pipefail

          release_dir="$1"
          expected_image="$2"
          expected_revision="$3"
          app_domain="$4"

          cd "$release_dir"
          bash scripts/check-deploy.sh \
            "$release_dir" \
            "$expected_image" \
            "$expected_revision" \
            "$app_domain" \
            --rollback-only
          REMOTE
            exit 1
          fi
